<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معلومات المبيعات | EraaSoft Sales Hub</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/animate.min.css">
  <link rel="stylesheet" href="assets/vendor/aos.css">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="sales-info">

  <!-- قالب زرار التبديل -->
  <template id="theme-toggle-template">
    <button id="theme-toggle" class="theme-toggle" aria-label="تغيير الوضع">
      <span class="toggle-icon">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </span>
    </button>
  </template>

  <div id="site-nav"></div>

  <header class="eh-hero on-dark">
    <div class="container">
      <h1 class="animate__animated animate__fadeInUp">رسايل التحويل ومعلومات السيلز</h1>
      <p class="lead animate__animated animate__fadeInUp" style="animation-delay:.12s">
        <span class="bg-warning text-dark fw-bold px-3 py-1 rounded shadow-sm d-inline-block">
          صلي علي النبي ونت شغال عشان ربنا يكرمك
        </span>
      </p>
    </div>
  </header>

  <main class="container py-4 py-lg-5">
    
    <!-- كارت بيانات منصة الطلاب (LMS) بالعرض الكامل -->
    <div class="row g-4 mb-4">
      <div class="col-12">
        <div class="card shadow-sm border-0 rounded-3">
          <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between py-3 px-3 px-md-4">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-laptop fs-4"></i>
              <h5 class="card-title mb-0 fw-bold">منصة الطلاب (LMS)</h5>
            </div>
            <!-- زر الانتقال المباشر للمنصة -->
            <a href="https://admin.eraasoft.online/students" target="_blank" rel="noopener" class="btn btn-light text-primary fw-bold shadow-sm btn-sm px-3">
              فتح المنصة <i class="bi bi-box-arrow-up-right ms-1"></i>
            </a>
          </div>
          <div class="card-body p-3 p-md-4">
            <div class="row g-3">
              
              <!-- اسم المستخدم -->
              <div class="col-12 col-md-6">
                <label class="form-label fw-bold text-secondary mb-1">اسم المستخدم (User Name)</label>
                <div class="input-group">
                  <input type="text" class="form-control text-start bg-light fw-medium" value="salseinfoo@eraasoft.com" readonly dir="ltr">
                  <button type="button" class="btn btn-outline-primary" onclick="EraaUI.copyWithFeedback(this, 'salseinfoo@eraasoft.com', 'تم نسخ اسم المستخدم')">
                    <i class="bi bi-copy me-1"></i> نسخ
                  </button>
                </div>
              </div>

              <!-- كلمة السر -->
              <div class="col-12 col-md-6">
                <label class="form-label fw-bold text-secondary mb-1">كلمة السر (Password)</label>
                <div class="input-group">
                  <input type="text" class="form-control text-start bg-light fw-medium" value="salseinfo@#$" readonly dir="ltr">
                  <button type="button" class="btn btn-outline-primary" onclick="EraaUI.copyWithFeedback(this, 'salseinfo@#$', 'تم نسخ كلمة السر')">
                    <i class="bi bi-copy me-1"></i> نسخ
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- باقي محتوى الصفحة الديناميكي (الكروت الأخرى) -->
    <div class="row g-4 justify-content-center" id="salesContent">
    </div>
  </main>

  <!-- زرار العودة للأعلى -->
  <button id="backToTop" class="back-to-top" type="button" aria-label="العودة للأعلى" title="العودة للأعلى">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>

  <div id="site-footer"></div>

  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/sales info.js"></script>
</body>
</html>
