<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفيدباكس | EraaSoft Sales Hub</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/animate.min.css">
  <link rel="stylesheet" href="assets/vendor/aos.css">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="feedback">
    <!-- قالب الزرار (سيتم إدراجه تلقائياً بجانب اللوجو داخل الناف بار) -->
  <template id="theme-toggle-template">
    <button id="theme-toggle" class="theme-toggle" aria-label="تغيير الوضع">
      <span class="toggle-icon">
        <!-- أيقونة الشمس (Light Mode) -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- أيقونة القمر (Dark Mode) -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </span>
    </button>
  </template>

  <div id="site-nav"></div>

  <header class="eh-hero eh-hero--sm on-dark">
    <div class="container">
      <h1 class="animate__animated animate__fadeInUp">فيدباك الطلاب</h1>
<p class="lead animate__animated animate__fadeInUp" style="animation-delay:.12s">
  <span class="bg-warning text-dark fw-bold px-3 py-1 rounded shadow-sm d-inline-block">
    صلي علي النبي ونت شغال عشان ربنا يكرمك
  </span>
</p>
    </div>
  </header>

  <main class="container py-4 py-lg-5">
    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="نوع الفيدباك">
        <button type="button" role="tab" id="tab-images" data-tab="images" aria-selected="true">
          <i class="bi bi-images"></i>صور <span class="count" id="cnt-images"></span>
        </button>
        <button type="button" role="tab" id="tab-videos" data-tab="videos" aria-selected="false">
          <i class="bi bi-camera-video"></i>فيديوهات <span class="count" id="cnt-videos"></span>
        </button>
      </div>
      <span class="result-count" id="resultCount" aria-live="polite"></span>
    </div>

    <div class="chips mb-4" id="chips" role="group" aria-label="فلترة حسب الدبلومة"></div>

    <div class="row g-3" id="grid">
      <div class="load-note" style="padding:16px;border:1px dashed #999;border-radius:10px;background:#fff;color:#444;line-height:1.9"></div>
    </div>

    <div class="empty" id="emptyState" hidden>
      <i class="bi bi-camera-video-off"></i>
      <h2>لسه مفيش فيديوهات هنا</h2>
      <p>أول ما يتضاف فيديو هيظهر في الصفحة دي.</p>
    </div>
  </main>

  <!-- صور الفيدباكس -->
  <div class="modal fade lb" id="lightbox" tabindex="-1" aria-label="عرض الصورة" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen m-0">
      <div class="modal-content">
        <div class="lb-bar on-dark">
          <div class="lb-title"><span class="lb-tag" id="lbTag"></span><span class="lb-count" id="lbCount"></span></div>
          <div class="lb-tools">
            <a class="lb-btn lb-btn--gold" id="lbDownload" href="#" download><i class="bi bi-download"></i>تحميل</a>
            <button type="button" class="lb-btn" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i>إغلاق</button>
          </div>
        </div>
        <div class="lb-stage on-dark" id="lbStage">
          <button type="button" class="lb-nav prev" id="lbPrev" aria-label="الصورة السابقة"><i class="bi bi-chevron-right"></i></button>
          <img class="lb-img" id="lbImg" alt="">
          <button type="button" class="lb-nav next" id="lbNext" aria-label="الصورة التالية"><i class="bi bi-chevron-left"></i></button>
        </div>
      </div>
    </div>
  </div>

<!-- مشغل الفيديو -->
<div class="modal fade vm" id="videoModal" tabindex="-1" aria-label="تشغيل الفيديو" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered vm-dialog">
    <div class="modal-content">
      <div class="modal-header border-0 on-dark d-flex justify-content-between align-items-center">
        <h2 class="modal-title" id="vmTitle"></h2>
        <div class="d-flex align-items-center gap-2">
          <!-- زر التحميل بالتنسيق البسيط والأنيق -->
          <a href="#" id="vmDownloadBtn" class="btn-download" aria-label="تحميل الفيديو">
            <i class="bi bi-download"></i>
            <span>تحميل</span>
          </a>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
      </div>
      <div class="vm-frame" id="vmFrame"></div>
    </div>
  </div>
</div>

  <!-- زرار العودة للأعلى -->
<button id="backToTop" class="back-to-top" type="button" aria-label="العودة للأعلى" title="العودة للأعلى">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 15-6-6-6 6"/>
  </svg>
</button>

  <div id="site-footer"></div>

  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
