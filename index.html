<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الدبلومات | EraaSoft Sales Hub</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/animate.min.css">
  <link rel="stylesheet" href="assets/vendor/aos.css">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/style.css">

  
</head>
<body data-page="diplomas">
 
  <!-- قالب الزرار (سيتم إدراجه تلقائياً بجانب اللوجو داخل الناف بار) -->
  <template id="theme-toggle-template">
    <button id="theme-toggle" class="theme-toggle" aria-label="تغيير الوضع">
      <span class="toggle-icon">
        <!-- أيقونة الشمس (Light Mode) -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- أيقونة القمر (Dark Mode) -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </span>
    </button>
  </template>

  <div id="site-nav"></div>

  <header class="eh-hero on-dark">
    <div class="container">
      <h1 class="animate__animated animate__fadeInUp">اختار الدبلومة وابعتها للعميل في ضغطة</h1>
<p class="lead animate__animated animate__fadeInUp" style="animation-delay:.12s">
  <span class="bg-warning text-dark fw-bold px-3 py-1 rounded shadow-sm d-inline-block">
    صلي علي النبي ونت شغال عشان ربنا يكرمك
  </span>
</p>
      <div class="search-wrap animate__animated animate__fadeInUp" style="animation-delay:.24s">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="dipSearch" type="search" class="form-control" autocomplete="off"
               placeholder="دور على دبلومة…    " aria-label="بحث عن دبلومة">
      </div>
    </div>
  </header>

  <main class="container py-4 py-lg-5">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="فلترة حسب الدبلومة"></div>
      <span class="result-count" id="resultCount" aria-live="polite"></span>
    </div>

    <div class="row g-3 g-lg-4" id="dipGrid">
      <div class="load-note" style="padding:16px;border:1px dashed #999;border-radius:10px;background:#fff;color:#444;line-height:1.9"></div>
    </div>

    <div class="empty" id="emptyState" hidden>
      <i class="bi bi-search"></i>
      <h2>مفيش دبلومة بالاسم ده</h2>
      <p>جرّب كلمة تانية أو اختار "الكل".</p>
    </div>
  </main> 

  <!-- معاينة الرسالة -->
  <div class="modal fade" id="msgModal" tabindex="-1" aria-labelledby="msgModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="msgModalTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          <div class="msg-box" id="msgBox"></div>
        </div>
        <div class="modal-footer justify-content-start gap-2">
          <button type="button" class="btn-eh" id="msgCopy"><i class="bi bi-clipboard2"></i><span>نسخ الرسالة كامله</span></button>
          <button type="button" class="btn-eh btn-eh--ghost" id="msgCopyLink"><i class="bi bi-link-45deg"></i><span>نسخ لينك المحتوي</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- زرار العودة للأعلى -->
<button id="backToTop" class="back-to-top" type="button" aria-label="العودة للأعلى" title="العودة للأعلى">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 15-6-6-6 6"/>
  </svg>
</button>

  <div id="site-footer"></div>

  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/diplomas.js"></script>
  <script src="js/sales info.js"></script>

</body>
</html>
